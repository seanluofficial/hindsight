[project]
name = "hindsight"
version = "0.1.0"
description = "Can an LLM extract predictive signal from SEC 8-K filings it cannot identify?"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "requests>=2.32",
    "pydantic>=2.7",
    "pandas-market-calendars>=4.4",
    "python-dotenv>=1.0",
    "lxml>=5.2",
    "beautifulsoup4>=4.12",
    "streamlit>=1.35",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-requests",
    "pandas-stubs",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hindsight"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]

[tool.mypy]
# Deliberately unpinned: numpy's bundled stubs use `type` statements that only parse
# under 3.12+, so mypy follows the interpreter it runs on rather than the 3.11 floor.
strict = true
warn_unreachable = true
plugins = []

[[tool.mypy.overrides]]
module = ["pandas_market_calendars.*", "bs4.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["network: hits a live external API"]
